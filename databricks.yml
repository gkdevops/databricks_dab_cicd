# This is a Declarative Automation Bundle definition for dab_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_demo
  uuid: f1c3ae66-e2e0-4013-afc2-b6e8032460af

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-ca8c96c7-f968.cloud.databricks.com
    variables:
      catalog: prepzee-dev
      schema: sales
  uat:
    mode: production
    workspace:
      host: https://dbc-ca8c96c7-f968.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/chgoutam@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/chgoutam@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prepzee-uat
      schema: sales
    permissions:
      - user_name: chgoutam@gmail.com
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      host: https://dbc-ca8c96c7-f968.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/chgoutam@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/chgoutam@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prepzee-prod
      schema: sales
    permissions:
      - user_name: chgoutam@gmail.com
        level: CAN_MANAGE
